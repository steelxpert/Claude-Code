*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:12px}
h1{font-size:20px;font-weight:600;margin:0}
.badge{border:1px solid var(--accent);color:var(--accent);padding:2px 8px;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
#stage{position:relative;width:100%;height:62vh;min-height:360px;background:var(--scene);border:1px solid var(--line);overflow:hidden;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.hint{position:absolute;left:8px;bottom:6px;font-size:12px;color:var(--muted);pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;align-items:center}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--line);padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
:focus-visible{outline:2px solid var(--c-floor);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip input{margin:0}
.sw{display:inline-block;width:12px;height:12px;border:1px solid var(--line)}
.chip .n{color:var(--muted);font-size:12px}
.layers{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
h2{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:24px 0 8px}
table{border-collapse:collapse;width:100%;max-width:900px;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:5px 10px 5px 0;border-bottom:1px solid var(--line)}
th{width:34%;font-weight:600;color:var(--muted)}
ul{margin:0;padding-left:20px;max-width:900px}
li{margin-bottom:4px}
.details{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
[hidden]{display:none!important}
.notes{margin-top:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);max-width:900px}
.notes h3{margin:0 0 6px;font-size:16px;font-weight:600}
.notes h4{margin:10px 0 4px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.notes p{margin:6px 0}
.notes .badge{display:inline-block;margin-top:6px}
.selbar{margin-top:12px}
.selline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.selline .cnt{font-weight:600}
.selline .n{color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip2{font-size:12px;padding:2px 8px;border:1px solid var(--hl);background:var(--surface);color:var(--text);cursor:pointer}
.selhint{font-size:13px;color:var(--muted);margin:6px 0 0}
.tip{position:absolute;right:8px;top:8px;max-width:70%;background:var(--surface);color:var(--text);border:1px solid var(--hl);padding:3px 8px;font-size:13px;pointer-events:none}
.selhelp{font-size:12px;color:var(--muted);margin:4px 0 0}
#stage canvas:focus-visible{outline:2px solid var(--c-floor);outline-offset:-2px}
.ctxmenu{position:absolute;z-index:5;min-width:250px;background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.28);padding:4px 0}
.ctxmenu button{display:flex;justify-content:space-between;gap:24px;width:100%;border:0;background:transparent;text-align:left;padding:5px 12px;font-size:13px}
.ctxmenu button:disabled{color:var(--muted);opacity:.55;cursor:default}
.ctxmenu button:hover:not(:disabled),.ctxmenu button:focus{background:var(--bg)}
.ctxmenu .k{color:var(--muted);font-size:12px}
.foot{margin-top:20px;font-size:12px;color:var(--muted)}
@media (max-width:520px){th{width:40%}}

</div>

  };

}
$('sel-clear').addEventListener('click',clearSel);
showAllBtn.addEventListener('click',showAll);
function say(t){selMsg.textContent=t;clearTimeout(msgTimer);msgTimer=setTimeout(function(){selMsg.textContent=''},2500)}
$('sel-copy').addEventListener('click',function(){
  var txt=SEL.map(function(m){return m.label}).join('\n');
  function manual(){
    try{var r=document.createRange();r.selectNodeContents(selChips);var sl=window.getSelection();sl.removeAllRanges();sl.addRange(r);document.execCommand('copy')}catch(e){}
    say(T.sel.manual);
  }
  try{
    navigator.clipboard.writeText(txt).then(function(){say(T.sel.copied)},manual);
  }catch(e){manual()}
});
function collect(o,out){
  if(!o.visible) return;
  if(o.isMesh){if(o.userData.member&&!o.userData.nopick)out.push(o);return}
  o.children.forEach(function(c){collect(c,out)});
}
var rc=new THREE.Raycaster(), downInfo=null, lpTimer=0, cv=renderer.domElement, overCv=false;
cv.tabIndex=0;
function hitAt(cx,cy){
  var r=cv.getBoundingClientRect();
  rc.setFromCamera(new THREE.Vector2((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height*2-1)),camera);
  var list=[];
  if(mode==='house') LAYERS.forEach(function(l){collect(l.group,list)}); else collect(DG[mode],list);
  scene.updateMatrixWorld(true);
  var hit=rc.intersectObjects(list,false)[0];
  return hit?hit.object.userData.member:null;
}
/* zoom toward / away from the point under the cursor (wheel); OrbitControls' own zoom is off */
controls.enableZoom=false;
cv.addEventListener('wheel',function(e){
  e.preventDefault();
  if(!e.deltaY) return;
  var r=cv.getBoundingClientRect();
  rc.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1)),camera);
  var list=[];
  if(mode==='house') LAYERS.forEach(function(l){collect(l.group,list)}); else if(DG[mode]) collect(DG[mode],list);
  scene.updateMatrixWorld(true);
  var hit=rc.intersectObjects(list,false)[0], P;
  if(hit) P=hit.point.clone();
  else {
    var n=new THREE.Vector3(); camera.getWorldDirection(n);
    P=new THREE.Vector3(); if(!rc.ray.intersectPlane(new THREE.Plane().setFromNormalAndCoplanarPoint(n,controls.target),P)) return;
  }
  var s=Math.pow(1.0015,Math.max(-200,Math.min(200,e.deltaY)));
  var d=camera.position.distanceTo(controls.target)*s;
  if(d<controls.minDistance||d>controls.maxDistance) return;
  camera.position.sub(P).multiplyScalar(s).add(P);
  controls.target.sub(P).multiplyScalar(s).add(P);
  controls.update();
},{passive:false});
function showTip(mem){tipEl.textContent=mem.label;tipEl.hidden=false;clearTimeout(tipTimer);tipTimer=setTimeout(function(){tipEl.hidden=true},2000)}
/* context menu */
var menuEl=document.createElement('div'); menuEl.className='ctxmenu'; menuEl.setAttribute('role','menu'); menuEl.hidden=true; stage.appendChild(menuEl);
var MENU=[
  ['hide',hideSel,function(){return SEL.length>0}],
  ['isolate',isolateSel,function(){return SEL.length>0}],
  ['ghost',toggleGhost,function(){return SEL.length>0}],
  ['zoom',zoomSel,function(){return SEL.length>0}],
  ['same',sameKind,function(){return SEL.length>0}],
  ['invsel',invertSel,function(){return true}],
  ['invvis',invertVis,function(){return true}],
  ['showall',showAll,function(){return hiddenCount()>0||ghostOn}],
  ['clear',clearSel,function(){return SEL.length>0}]
];
function closeMenu(){if(!menuEl.hidden){menuEl.hidden=true;try{cv.focus({preventScroll:true})}catch(e){}}}
function openMenu(cx,cy){
  menuEl.textContent='';
  MENU.forEach(function(it){
    var b=document.createElement('button'), a=document.createElement('span'), k=document.createElement('span');
    b.type='button'; b.setAttribute('role','menuitem');
    a.textContent=T.menu[it[0]][0]; k.className='k'; k.textContent=T.menu[it[0]][1];
    b.appendChild(a); b.appendChild(k); b.disabled=!it[2]();
    b.addEventListener('click',function(){closeMenu();it[1]()});
    menuEl.appendChild(b);
  });
  menuEl.hidden=false;
  var r=stage.getBoundingClientRect(), w=menuEl.offsetWidth, h=menuEl.offsetHeight;
  menuEl.style.left=Math.max(4,Math.min(cx-r.left,r.width-w-4))+'px';
  menuEl.style.top=Math.max(4,Math.min(cy-r.top,r.height-h-4))+'px';
  var f=menuEl.querySelector('button:not(:disabled)'); if(f) f.focus();
}
function contextAt(cx,cy){
  var mem=hitAt(cx,cy);
  if(mem&&!mem.sel&&SEL.length===0){toggleMember(mem);showTip(mem)}
  openMenu(cx,cy);
}
cv.addEventListener('pointerdown',function(e){
  clearTimeout(lpTimer);
  if(!e.isPrimary){downInfo=null;return}
  var d0={x:e.clientX,y:e.clientY,t:performance.now(),b:e.button,moved:false,lp:false};
  downInfo=d0;
  try{cv.focus({preventScroll:true})}catch(err){}
  if(e.pointerType==='touch') lpTimer=setTimeout(function(){if(downInfo===d0&&!d0.moved){d0.lp=true;contextAt(d0.x,d0.y)}},600);
});
cv.addEventListener('pointermove',function(e){
  var d=downInfo;
  if(d&&!d.moved&&Math.hypot(e.clientX-d.x,e.clientY-d.y)>=5){d.moved=true;clearTimeout(lpTimer)}
});
cv.addEventListener('pointerup',function(e){
  clearTimeout(lpTimer);
  var d=downInfo; downInfo=null;
  if(!d||d.lp||Math.hypot(e.clientX-d.x,e.clientY-d.y)>=5) return;
  if(d.b===2){contextAt(e.clientX,e.clientY);return}
  if(d.b===0&&performance.now()-d.t<400){var mem=hitAt(e.clientX,e.clientY);if(mem){toggleMember(mem);showTip(mem)}}
});
cv.addEventListener('dblclick',function(e){if(!hitAt(e.clientX,e.clientY))setView('reset')});
cv.addEventListener('contextmenu',function(e){e.preventDefault()});
cv.addEventListener('pointerenter',function(){overCv=true});
cv.addEventListener('pointerleave',function(){overCv=false});
cv.addEventListener('wheel',closeMenu,{passive:true});
window.addEventListener('scroll',closeMenu,true);
document.addEventListener('pointerdown',function(e){if(!menuEl.hidden&&!menuEl.contains(e.target))closeMenu()},true);
document.addEventListener('keydown',function(e){
  var tg=e.target, tn=tg&&tg.tagName;
  if(tn==='INPUT'||tn==='TEXTAREA'||tn==='SELECT'||(tg&&tg.isContentEditable)) return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  var menuOpen=!menuEl.hidden;
  if(e.key==='Escape'){closeMenu();clearSel();e.preventDefault();return}
  if(!(overCv||document.activeElement===cv||menuOpen)) return;
  if(menuOpen&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    var items=Array.prototype.slice.call(menuEl.querySelectorAll('button:not(:disabled)')), i=items.indexOf(document.activeElement);
    if(items.length){i=e.key==='ArrowDown'?(i+1)%items.length:(i<=0?items.length-1:i-1);items[i].focus()}
    e.preventDefault(); return;
  }
  var k=e.key.toLowerCase(), done=true;
  if(k==='h')hideSel(); else if(k==='i'){if(e.shiftKey)invertSel();else isolateSel()}
  else if(k==='g')toggleGhost(); else if(k==='f')zoomSel(); else if(k==='s')sameKind();
  else if(k==='v')invertVis(); else if(k==='a')showAll(); else done=false;
  if(done){e.preventDefault();closeMenu()}
});
updateSel();

/* ---------- loop ---------- */
(function loop(){
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene,camera);
})();
window.__counts=COUNT;
window.__dbg={camera:camera,controls:controls,showMode:showMode,applyExplode:applyExplode,setExplode:function(v){v=Math.max(0,Math.min(1,+v||0));setSlider(v);applyExplode(v)}};
})();
</script>
