*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}

:focus-visible{outline:2px solid var(--c-floor);outline-offset:2px}

.chip input{margin:0}
.sw{display:inline-block;width:12px;height:12px;border:1px solid var(--line)}
.chip .n{color:var(--muted);font-size:12px}
.layers{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}

.notes p{margin:6px 0}
.notes .badge{display:inline-block;margin-top:6px}

<script>
"use strict";
const T = {
  docTitle: 'Pilot House Framing',
  title: 'FLINS pilot house \u2014 framing concept',
  badge: 'CONCEPT \u2014 sizes schematic, not verified',
  hint: 'Drag to rotate, wheel or pinch to zoom, right-drag to pan',
  buttons: {front: 'Front', rear: 'Rear', top: 'Top', reset: 'Reset view'},
  explode: 'Explode roof',
  layersLabel: 'Layers',
  layers: {
    screws: 'Soil screws', floor: 'Ground floor frame', walls: 'Wall panels (load-bearing)',
    frames: 'Main frames', rods: 'Tie rods',
    rp: 'Roof panels: purlins + tracks', rb: 'Roof panels: blocking + bridging', rx: 'Roof panels: strap bracing',
    loft: 'Loft floor', straps: 'Strap bracing', parts: 'Partitions (non-load-bearing)', glass: 'Glazing'
  },
  detailsLabel: 'Details',
  details: {house: 'Whole house', knee: 'Knee + tie rod', apex: 'Apex', panel: 'Roof panel on rafter', block: 'Blocking + bridging', skyp: 'Skylight opening in panel'},
  notesLabels: {parts: 'Parts', governs: 'Governs', tag: 'CONCEPT \u2014 preliminary, not a check'},
  notes: {
    knee: {title: 'Knee and tie-rod end', parts: [
      'Leg and rafter: 2 \u00d7 C150\u00d745\u00d71.5 back-to-back with 6 mm gap',
      'Gusset: 6 mm plate between the webs',
      'Bolts: 4 \u00d7 M12 per member, double shear',
      'Tie rod M16 with fork end pinned to the gusset, and turnbuckle',
      'Packer plates in the rafter gap at about 600 mm',
      'Eave edge of the roof panel: to be detailed'],
      governs: 'bolt bearing in the 2 \u00d7 1.5 mm webs (about 30 kN per bolt, preliminary); tie force about 9 kN.'},
    apex: {title: 'Apex', parts: [
      'Rafters: 2 \u00d7 C150\u00d745\u00d71.5 back-to-back with 6 mm gap, 40\u00b0 each side',
      'Gusset: 6 mm kite plate between the webs, covering 400 mm of each rafter',
      'Bolts: 4 \u00d7 M12 per rafter',
      'Gusset stays below the rafter top lines',
      'Ridge edge of the roof panels: to be detailed'],
      governs: 'bolt bearing in the 2 \u00d7 1.5 mm webs; rafter compression about 17 kN (preliminary).'},
    panel: {title: 'Roof panel on rafter', parts: [
      'Rafter pair 2 \u00d7 C150\u00d745\u00d71.5 with 6 mm gap, at 40\u00b0',
      'Two tracks with webs 6 mm apart, centred on the rafter gap: upper flange 45 mm, lower flange 70 mm lying on the rafter top flanges, flanges pointing into their own panels',
      'Purlins C150 at about 556 mm along the slope, ends inside the tracks',
      'One self-drilling screw through each track lower flange into the rafter flange, midway between purlins (about 600 mm)',
      'Track flange to purlin flange screws, top and bottom, at each purlin end'],
      governs: 'panel sliding down the slope, about 5 kN per track line; about 0.8 kN per screw against about 4.6 kN bearing (preliminary); purlin end uplift on the track screws.'},
    block: {title: 'Blocking and bridging', parts: [
      'Purlins C150 at about 556 mm along the slope',
      'Two flat straps 50 \u00d7 1.5 mm, one on the top face and one on the bottom face, one screw per strap per purlin flange',
      'Solid C150 blocks between the first and second and between the sixth and seventh purlin, with clip angles to the purlin webs'],
      governs: 'the straps collect about 1.1 kN per purlin, about 8 kN at the row end (preliminary); the row needs an anchor, decided with the ridge detail.'},
    skyp: {title: 'Skylight opening in panel', parts: [
      'Jambs: C150 + U150 track boxed, parallel to the purlins, full panel length, each set midway between two purlin lines',
      'Head and sill: one U150 track each, down the slope between the jambs, web facing the window',
      'Three cut purlins end as six cripples inside the head and sill tracks',
      'Jamb cap track stopped 50 mm short at each end so the C enters the panel track',
      'Two bridging rows in line with the head and sill tracks, continuous from eave to ridge; the head and sill act as the blocking between the jambs',
      'Opening 780 \u00d7 1600 mm'],
      governs: 'jamb about 2.3 kNm over the 3.0 m bay (preliminary); head and sill carry three stub ends of about 0.45 kN each.'}
  },
  factsHead: 'Key facts',
  facts: [
    ['Grid', '12\u00a0500 \u00d7 5\u00a0200 mm (3250 + 3000 + 3000 + 3250)'],
    ['Scope', 'Bare steel skeleton. Deck, covering and finishes by others, not relied on structurally.'],
    ['Roof', '8 factory panels; purlins C150 at about 560 mm ending in asymmetric tracks (lower flange 70 mm); tracks screwed to the rafters at 600 mm; 6 mm gap between panels'],
    ['Main frames', 'Grids 2, 3, 4: back-to-back C150, steel tie rod at eaves'],
    ['Ground floor', 'Cross bearers on 15 soil screws, joists lengthwise'],
    ['Loft', 'Over bay 1\u20132, joists on a header at grid 2'],
    ['Bracing', 'Flat-strap X with hold-downs'],
    ['Profiles', 'C150\u00d745\u00d71.5 / U150\u00d745, max 1.5 mm']
  ],
  openHead: 'Open points',
  open: [
    'Bridging rows to be spliced over the ridge to carry the down-slope load (with the ridge detail).',
    'Asymmetric track is a new section for FLINS.',
    'Eave and ridge framing: to be detailed.',
    'Skylight panel has no X-bracing by design; the neighbouring panels carry the bracing (to be shown in the calculation).',
    'Little bracing length on the glazed wall B.',
    'Cross bearers probably need a deeper section.',
    'Bolt bearing in 1.5 mm webs at frame joints.',
    'Uplift on the soil screws.'
  ],
  foot: 'Grid lines: 1\u20135 along the length, A (rear) and B (front, glazed) across. Counts beside each layer are drawn members.'
};
function $(id){return document.getElementById(id)}
document.title = T.docTitle;
$('t-title').textContent = T.title; $('t-badge').textContent = T.badge; $('t-hint').textContent = T.hint;
$('t-explode').textContent = T.explode; $('layers').setAttribute('aria-label', T.layersLabel);
['front','rear','top'].forEach(function(n){$('v-'+n).textContent = T.buttons[n]});
$('v-reset').textContent = T.buttons.reset;
$('t-h-facts').textContent = T.factsHead; $('t-h-open').textContent = T.openHead; $('t-foot').textContent = T.foot;
T.facts.forEach(function(r){var tr=document.createElement('tr'),th=document.createElement('th'),td=document.createElement('td');th.textContent=r[0];td.textContent=r[1];tr.appendChild(th);tr.appendChild(td);$('t-facts').appendChild(tr)});
T.open.forEach(function(t){var li=document.createElement('li');li.textContent=t;$('t-open').appendChild(li)});
(function(){
var root=document.documentElement;
var stage=document.getElementById('stage');
var V=function(x,y,z){return new THREE.Vector3(x,y,z)};

/* ---------- constants (metres) ---------- */
var FL=0.45, EV=FL+2.6, LF=FL+2.35, W=5.2, L=12.5;
var TAN=Math.tan(40*Math.PI/180), COS=Math.cos(40*Math.PI/180), SIN=Math.sin(40*Math.PI/180);
var GX=[0,3.25,6.25,9.25,12.5];
function yR(z){return EV+(2.6-Math.abs(z-2.6))*TAN}
var RIDGE=yR(2.6);
function r3(v){return Math.round(v*1000)/1000}
function steps(a,b,s){var o=[],i;for(i=0;a+i*s<=b+1e-9;i++)o.push(r3(a+i*s));return o}
function uniq(a){return a.filter(function(v,i){return a.indexOf(v)===i}).sort(function(p,q){return p-q})}

/* ---------- layers ---------- */
var LAYERS=[
 {id:'screws',name:T.layers.screws,tok:'--c-screw'},
 {id:'floor',name:T.layers.floor,tok:'--c-floor'},
 {id:'walls',name:T.layers.walls,tok:'--c-wall'},
 {id:'frames',name:T.layers.frames,tok:'--c-frame'},
 {id:'rods',name:T.layers.rods,tok:'--c-rod'},
 {id:'rp',name:T.layers.rp,tok:'--c-purlin'},
 {id:'rb',name:T.layers.rb,tok:'--c-sky'},
 {id:'rx',name:T.layers.rx,tok:'--accent'},
 {id:'loft',name:T.layers.loft,tok:'--c-loft'},
 {id:'straps',name:T.layers.straps,tok:'--c-strap'},
 {id:'parts',name:T.layers.parts,tok:'--c-part'},
 {id:'glass',name:T.layers.glass,tok:'--c-glass'}
];
var scene=new THREE.Scene();
scene.background=new THREE.Color(0xe3e8ee);
var G={}, MAT={}, COUNT={};
LAYERS.forEach(function(l){
  l.group=new THREE.Group(); l.group.name=l.id; scene.add(l.group);
  G[l.id]=l.group; COUNT[l.id]=0;
  if(l.id==='glass'){
    MAT[l.id]=new THREE.MeshStandardMaterial({color:0x8fc6ea,transparent:true,opacity:.3,side:THREE.DoubleSide,depthWrite:false,roughness:.2,metalness:0});
  } else {
    MAT[l.id]=new THREE.MeshStandardMaterial({color:0x888888,roughness:.6,metalness:.3});
  }
});
var roofGlass=new THREE.Group(); G.glass.add(roofGlass);
MAT.rptrack=new THREE.MeshStandardMaterial({color:0x2f4b66,roughness:.6,metalness:.3});
MAT.rptrim=new THREE.MeshStandardMaterial({color:0xc28a2e,roughness:.6,metalness:.3});
var edgeMat=new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:.35});

/* ---------- helpers ---------- */
function M(id,p1,p2,w,d,o){
  o=o||{};
  var dir=new THREE.Vector3().subVectors(p2,p1), len=dir.length();
  if(len<1e-6) return;
  var z=dir.clone().normalize();
  var ref=o.ref||(Math.abs(z.y)>0.99?V(0,0,1):V(0,1,0));
  var x=new THREE.Vector3().crossVectors(ref,z);
  if(x.lengthSq()<1e-8) x.set(1,0,0);
  x.normalize();
  var y=new THREE.Vector3().crossVectors(z,x);
  var geo=new THREE.BoxGeometry(w,d,len);
  var m=new THREE.Mesh(geo,o.mat||MAT[id]);
  m.position.copy(p1).add(p2).multiplyScalar(.5);
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,y,z));
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),edgeMat));
  (o.group||G[id]).add(m);
  if(!o.nocount) COUNT[id]++;
  return m;
}
function B(id,cx,cy,cz,sx,sy,sz,o){
  o=o||{};
  var geo=new THREE.BoxGeometry(sx,sy,sz), m=new THREE.Mesh(geo,MAT[id]);
  m.position.set(cx,cy,cz);
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),edgeMat));
  G[id].add(m); if(!o.nocount) COUNT[id]++;
  return m;
}
function CYL(id,p1,p2,dia,o){
  o=o||{};
  var dir=new THREE.Vector3().subVectors(p2,p1), len=dir.length();
  var m=new THREE.Mesh(new THREE.CylinderGeometry(dia/2,dia/2,len,16),MAT[id]);
  m.position.copy(p1).add(p2).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(V(0,1,0),dir.normalize());
  G[id].add(m); if(!o.nocount) COUNT[id]++;
  return m;
}
function QUAD(id,pts,o){
  var g=new THREE.BufferGeometry();
  var a=[];[0,1,2,0,2,3].forEach(function(i){a.push(pts[i].x,pts[i].y,pts[i].z)});
  g.setAttribute('position',new THREE.Float32BufferAttribute(a,3)); g.computeVertexNormals();
  var m=new THREE.Mesh(g,MAT.glass); m.renderOrder=2; G[id].add(m);
  if(!(o&&o.nocount)) COUNT[id]++;
}

/* ---------- 1 soil screws ---------- */
GX.forEach(function(x){[0,2.6,5.2].forEach(function(z){
  CYL('screws',V(x,-1.6,z),V(x,FL-0.2,z),0.09);
  B('screws',x,FL-0.2-0.005,z,0.2,0.01,0.2,{nocount:true});
});});

/* ---------- 2 ground floor ---------- */
GX.forEach(function(x){M('floor',V(x,FL-0.1,0),V(x,FL-0.1,W),0.09,0.2)});
[0,W].forEach(function(z){M('floor',V(0,FL-0.075,z),V(L,FL-0.075,z),0.045,0.15)});
for(var bi=0;bi<4;bi++){
  [0.4,1.0,1.6,2.2,3.0,3.6,4.2,4.8].forEach(function(z){
    M('floor',V(GX[bi]+0.045,FL-0.075,z),V(GX[bi+1]-0.045,FL-0.075,z),0.045,0.15);
  });
}

/* ---------- 3 walls ---------- */
var NZ=V(0,0,1), NX=V(1,0,0);
// wall A (rear)
(function(){
  var z=0, ro={ref:NZ};
  M('walls',V(0,FL+0.02,z),V(1.6,FL+0.02,z),0.04,0.15,ro);
  M('walls',V(2.5,FL+0.02,z),V(L,FL+0.02,z),0.04,0.15,ro);
  M('walls',V(0,EV-0.02,z),V(L,EV-0.02,z),0.04,0.15,ro);
  var xs=steps(0,12,0.6).concat([12.5]).filter(function(x){return x<1.6||x>2.5});
  xs=uniq(xs.concat([1.6,2.5]));
  xs.forEach(function(x){M('walls',V(x,FL+0.04,z),V(x,EV-0.04,z),0.045,0.15)});
  M('walls',V(1.6,FL+2.175,z),V(2.5,FL+2.175,z),0.09,0.15);
  M('walls',V(2.05,FL+2.25,z),V(2.05,EV-0.04,z),0.045,0.15);
})();
// wall B (front, glazed)
(function(){
  var z=W, ro={ref:NZ};
  M('walls',V(0,FL+0.02,z),V(L,FL+0.02,z),0.04,0.15,ro);
  M('walls',V(0,EV-0.02,z),V(L,EV-0.02,z),0.04,0.15,ro);
  var xs=steps(0,3,0.6).concat([3.25,11.6,12.2,12.5]);
  xs.forEach(function(x){M('walls',V(x,FL+0.04,z),V(x,EV-0.04,z),0.045,0.15)});
  [4.8,6.35,7.9,9.45,11.0].forEach(function(x){M('walls',V(x,FL+0.04,z),V(x,EV-0.22,z),0.09,0.15)});
  M('walls',V(3.25,EV-0.12,z),V(11.0,EV-0.12,z),0.09,0.2);
})();
// gables
function gable(x,win){
  var ro={ref:NX};
  M('walls',V(x,FL+0.02,0),V(x,FL+0.02,W),0.04,0.15,ro);
  M('walls',V(x,yR(0)+0.0718,0),V(x,RIDGE+0.0718,2.6),0.04,0.15,ro);
  M('walls',V(x,RIDGE+0.0718,2.6),V(x,yR(W)+0.0718,W),0.04,0.15,ro);
  var zs=steps(0,4.8,0.6).concat([W]).filter(function(z){return z<win.z0||z>win.z1});
  zs=uniq(zs.concat([win.z0,win.z1]));
  zs.forEach(function(z){M('walls',V(x,FL+0.04,z),V(x,yR(z)+0.0457,z),0.045,0.15,ro)});
  var zm=(win.z0+win.z1)/2, ya=FL+win.y0, yb=FL+win.y1;
  M('walls',V(x,ya,win.z0),V(x,ya,win.z1),0.045,0.15);          // sill
  M('walls',V(x,yb,win.z0),V(x,yb,win.z1),0.045,0.15);          // header
  M('walls',V(x,FL+0.04,zm),V(x,ya,zm),0.045,0.15,ro);          // cripple below
  M('walls',V(x,yb,zm),V(x,yR(zm)+0.0457,zm),0.045,0.15,ro);      // cripple above
  var gx=x===0?0.001:x-0.001;
  QUAD('glass',[V(gx,ya,win.z0),V(gx,ya,win.z1),V(gx,yb,win.z1),V(gx,yb,win.z0)]);
}
gable(0,{z0:1.5,z1:2.5,y0:1.3,y1:2.3});

    cSection(sp(F,s0,0.15,0),sp(F,s1,0.15,0),F.p,F.x,{group:g,mat:DM.c2,n0:0.05});
    clip(g,sp(F,s0,0.15,CT/2),AX,F.a,0.03);
    clip(g,sp(F,s1,0.15,CT/2),AX,neg(F.a),0.03);
  });
  addDetail('block',g);
})();

/* ---- detail 5: skylight opening in panel (full bay) ---- */
function uTrack(a0,a1,webDir,flangeDir,o,D){
  var t=CT, len=a0.distanceTo(a1), mid=a0.clone().add(a1).multiplyScalar(.5);
  var w=webDir.clone().normalize(), f=flangeDir.clone().normalize();
  function part(u,v,su,sv){obox(o.group,o.mat,mid.clone().addScaledVector(w,u).addScaledVector(f,v),w,f,su,sv,len)}
  part(0,0,D,t);
  [1,-1].forEach(function(s){part(s*(D/2-t/2),(0.045-t/2)/2,t,0.045+t/2)});
}
(function(){
  var g=new THREE.Group(), F=slopeF(), Q=0.15, hw=0.39, HX=1.5, XI=HX-0.00425, D=0.158;
  var S0=0.30, S1=3.10, i;
  /* asymmetric panel tracks */
  [[-(HX-0.003),1],[HX-0.003,-1]].forEach(function(t){
    track(sp(F,S0,Q,t[0]),sp(F,S1,Q,t[0]),F.p,F.x.clone().multiplyScalar(t[1]),{group:g,mat:DM.track});
  });
  /* purlins 1 and 5 */
  [1,5].forEach(function(k){cSection(sp(F,PSP(k),Q,-XI),sp(F,PSP(k),Q,XI),F.p,F.a,C1(g))});
  /* boxed jambs: C150 + cap track, cap stopped 0.05 short at each end */
  [0.860,2.525].forEach(function(s0){
    var sc=s0-0.024;
    cSection(sp(F,sc,Q,-XI),sp(F,sc,Q,XI),F.p,F.a,{group:g,mat:DM.trim});
    uTrack(sp(F,sc+0.0463,Q,-(XI-0.05)),sp(F,sc+0.0463,Q,XI-0.05),F.p,neg(F.a),{group:g,mat:DM.mid},D);
    [-1.2,-0.9,-0.6,-0.3,0,0.3,0.6,0.9,1.2].forEach(function(x){
      screw(g,sp(F,sc+0.025,Q+0.079,x),neg(F.p));
      screw(g,sp(F,sc+0.025,Q-0.079,x),F.p);
    });
  });
  /* head and sill U tracks: web facing the window, flanges away from it */
  [1,-1].forEach(function(sg){
    var out=F.x.clone().multiplyScalar(sg), xw=sg*(hw+CT/2);
    uTrack(sp(F,0.885,Q,xw),sp(F,2.5,Q,xw),F.p,out,{group:g,mat:DM.dark},D);
    clip(g,sp(F,0.885,Q,sg*hw),neg(out),F.a,0.03);
    clip(g,sp(F,2.5,Q,sg*hw),neg(out),neg(F.a),0.03);
    [2,3,4].forEach(function(k){
      var sk=PSP(k);
      cSection(sp(F,sk,Q,sg*(hw+CT)),sp(F,sk,Q,sg*XI),F.p,F.a,C1(g));
      [Q+0.0795+0.00125,Q-0.0795-0.00125].forEach(function(q,qi){
        screw(g,sp(F,sk+0.02,q,sg*(hw+CT+0.025)),qi?F.p:neg(F.p));
      });
    });
  });
  /* two bridging rows beside the opening */
  [-0.415,0.415].forEach(function(x){
    var sm=(S0+S1)/2, ln=S1-S0;
    obox(g,DM.rod,sp(F,sm,0.2305,x),F.a,F.x,ln,0.05,0.003);
    obox(g,DM.rod,sp(F,sm,0.0695,x),F.a,F.x,ln,0.05,0.003);
    [PSP(1),PSP(5),0.860+0.001,2.525+0.001,1.2,1.7,2.2].forEach(function(s){
      screw(g,sp(F,s+0.022,0.232,x),neg(F.p));
      screw(g,sp(F,s+0.022,0.068,x),F.p);
    });
  });
  var gp=[sp(F,0.885,Q,-hw),sp(F,0.885,Q,hw),sp(F,2.5,Q,hw),sp(F,2.5,Q,-hw)], gg=new THREE.BufferGeometry(), arr=[];
  [0,1,2,0,2,3].forEach(function(k){arr.push(gp[k].x,gp[k].y,gp[k].z)});
  gg.setAttribute('position',new THREE.Float32BufferAttribute(arr,3)); gg.computeVertexNormals();
  var gm=new THREE.Mesh(gg,MAT.glass); gm.renderOrder=2; g.add(gm);
  addDetail('skyp',g);
})();

/* ---------- lights, renderer, camera ---------- */
scene.add(new THREE.HemisphereLight(0xffffff,0x7d8896,0.85));
var sun=new THREE.DirectionalLight(0xffffff,0.75); sun.position.set(8,14,12); scene.add(sun);
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
stage.insertBefore(renderer.domElement,stage.firstChild);
var camera=new THREE.PerspectiveCamera(40,1,0.02,200);
var controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=3; controls.maxDistance=60; controls.maxPolarAngle=Math.PI*0.52;
var TARGET=V(6.25,2.3,2.6);

function fitDist(halfW,halfH){
  var t=Math.tan(camera.fov*Math.PI/360);
  return 1.15*Math.max(halfW/(t*camera.aspect),halfH/t)+3;
}
var mode='house', bounds={};
function setView(name){
  var d,dir;
  if(mode!=='house'){
    if(!bounds[mode]) bounds[mode]=new THREE.Box3().setFromObject(DG[mode]);
    var bb=bounds[mode], ctr=bb.getCenter(new THREE.Vector3());
    var slope=(mode==='block'||mode==='skyp'), pan=(mode==='panel');
    dir=({front:V(0,0.12,1),rear:V(0,0.12,-1),top:V(0,1,0.001)})[name]||(pan?V(0.25,-0.45,-0.93):slope?V(0.55,0.54,-0.91):V(1,0.25,0.35));
    dir.normalize();
    camera.position.copy(ctr).add(dir); camera.lookAt(ctr); camera.updateMatrixWorld();
    var rt=V(1,0,0).applyQuaternion(camera.quaternion), upv=V(0,1,0).applyQuaternion(camera.quaternion);
    var tv=Math.tan(camera.fov*Math.PI/360), th=tv*camera.aspect, dh=0, dv=0;
    for(var ci=0;ci<8;ci++){
      var cp=V(ci&1?bb.max.x:bb.min.x,ci&2?bb.max.y:bb.min.y,ci&4?bb.max.z:bb.min.z).sub(ctr);
      dh=Math.max(dh,cp.dot(dir)+Math.abs(cp.dot(rt))/th); dv=Math.max(dv,cp.dot(dir)+Math.abs(cp.dot(upv))/tv);
    }
    d=pan?Math.max(dh*1.08,dv*0.8):slope?Math.max(dh,dv)*1.08:Math.max(dh*1.08,dv*1.2);
    controls.target.copy(ctr);
    camera.position.copy(ctr).addScaledVector(dir,d);
    camera.lookAt(ctr); controls.update();
    return;
  }
  if(name==='front'){dir=V(0,0.12,1);d=fitDist(7.4,3.6)}
  else if(name==='rear'){dir=V(0,0.12,-1);d=fitDist(7.4,3.6)}
  else if(name==='top'){dir=V(0,1,0.001);d=fitDist(7.4,3.9)}
  else {dir=V(0.5,0.42,1);d=fitDist(9.6,5.2)}
  controls.target.copy(TARGET);
  camera.position.copy(TARGET).add(dir.normalize().multiplyScalar(d));
  camera.lookAt(TARGET); controls.update();
}
function resize(){
  var w=stage.clientWidth, h=stage.clientHeight;
  if(!w||!h) return;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
var firstFit=true;
new ResizeObserver(function(){
  resize();
  if(firstFit){firstFit=false;setView('reset')}
}).observe(stage);
resize(); setView('reset'); firstFit=false;

/* ---------- theme ---------- */
function applyTheme(){
  var cs=getComputedStyle(root);
  function c(n){return cs.getPropertyValue(n).trim()}
  scene.background.set(c('--scene'));
  LAYERS.forEach(function(l){MAT[l.id].color.set(c(l.tok))});
  DM.c1.color.set(c('--d-c1')); DM.c2.color.set(c('--d-c2')); DM.dark.color.set(c('--d-dark')); DM.rod.color.set(c('--accent')); DM.bolt.color.set(c('--d-bolt')); DM.track.color.set(c('--c-track')); DM.trim.color.set(c('--c-trim')); DM.mid.color.set(c('--d-mid')); MAT.rptrack.color.set(c('--c-track')); MAT.rptrim.color.set(c('--c-trim'));
  edgeMat.color.set(c('--edge'));
  gridMat.color.set(c('--grid'));
  paintLabels(c('--muted'));
}
applyTheme();
if(window.matchMedia){
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  if(mq.addEventListener) mq.addEventListener('change',applyTheme); else if(mq.addListener) mq.addListener(applyTheme);
}
new MutationObserver(applyTheme).observe(root,{attributes:true,attributeFilter:['data-theme']});

/* ---------- UI ---------- */
var layersEl=document.getElementById('layers'), cbs={};
LAYERS.forEach(function(l){
  var lab=document.createElement('label'); lab.className='chip';
  var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=true; cb.id='layer-'+l.id; cbs[l.id]=cb;
  cb.addEventListener('change',function(){l.group.visible=cb.checked});
  var sw=document.createElement('span'); sw.className='sw'; sw.style.background='var('+l.tok+')';
  var nm=document.createElement('span'); nm.textContent=l.name;
  var n=document.createElement('span'); n.className='n'; n.textContent=COUNT[l.id];
  lab.appendChild(cb); lab.appendChild(sw); lab.appendChild(nm); lab.appendChild(n);
  layersEl.appendChild(lab);
});
['front','rear','top'].forEach(function(n){document.getElementById('v-'+n).addEventListener('click',function(){setView(n)})});
document.getElementById('v-reset').addEventListener('click',function(){setView('reset')});
var explode=document.getElementById('explode');
var roofParts=[G.rp,G.rb,G.rx,roofGlass];

/* ---------- details selector ---------- */
var detailsEl=$('details'), dBtns={}, notesEl=$('notes');
detailsEl.setAttribute('aria-label',T.detailsLabel);
function renderNotes(k){
  var n=T.notes[k], L=T.notesLabels;
  notesEl.textContent='';
  if(!n){notesEl.hidden=true;return}
  function el(tag,txt){var e=document.createElement(tag);if(txt)e.textContent=txt;notesEl.appendChild(e);return e}
  el('h3',n.title); el('h4',L.parts);
  var ul=el('ul'); n.parts.forEach(function(t){var li=document.createElement('li');li.textContent=t;ul.appendChild(li)});
  var p=el('p'), b=document.createElement('strong'); b.textContent=L.governs+': '; p.appendChild(b); p.appendChild(document.createTextNode(n.governs));
  el('span',L.tag).className='badge';
  notesEl.hidden=false;
}
function showMode(k){
  mode=k; var house=k==='house';
  LAYERS.forEach(function(l){l.group.visible=house&&cbs[l.id].checked});
  gridLines.visible=house; labels.forEach(function(l){l.sp.visible=house});
  layersEl.style.display=house?'':'none'; $('explodeChip').style.display=house?'':'none';
  Object.keys(DG).forEach(function(d){DG[d].visible=(d===k)});
  Object.keys(dBtns).forEach(function(d){dBtns[d].setAttribute('aria-pressed',d===k?'true':'false')});
  controls.minDistance=house?3:0.2; controls.maxPolarAngle=house?Math.PI*0.52:Math.PI;
  renderNotes(k); setView('reset');
}
['house','knee','apex','panel','block','skyp'].forEach(function(k){
  var b=document.createElement('button'); b.type='button'; b.id='d-'+k; b.textContent=T.details[k];
  b.setAttribute('aria-pressed',k==='house'?'true':'false');
  b.addEventListener('click',function(){showMode(k)});
  detailsEl.appendChild(b); dBtns[k]=b;
});

/* ---------- loop ---------- */
(function loop(){
  requestAnimationFrame(loop);
  var t=explode.checked?1.2:0;
  roofParts.forEach(function(g){
    var d=t-g.position.y;
    g.position.y=Math.abs(d)<0.002?t:g.position.y+d*0.15;
  });
  controls.update();
  renderer.render(scene,camera);
})();
window.__counts=COUNT;
})();
